<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#22305A"/>
      <stop offset="100%" stop-color="#101827"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#F0713F"/>
      <stop offset="100%" stop-color="#C63A1E"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: LINE crops profile images to a circle. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Speech-bubble tail, drawn first so the circle hides its top edge. -->
  <path d="M 372 700 C 350 762 320 808 288 842 C 372 834 456 808 520 766 Z"
        fill="url(#vermilion)"/>

  <!-- Speech bubble -->
  <circle cx="512" cy="500" r="270" fill="url(#vermilion)"
          stroke="#FFF6E9" stroke-opacity="0.14" stroke-width="10"/>

  <!-- あ -->
  <text x="512" y="512" text-anchor="middle" dominant-baseline="central"
        font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif"
        font-size="330" font-weight="700" fill="#FFF6E9">あ</text>

  <!-- Wordmark, kept inside the circular safe area -->
  <text x="512" y="872" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="600" letter-spacing="10"
        fill="#FFF6E9" fill-opacity="0.72">NIHONGO</text>
</svg>
